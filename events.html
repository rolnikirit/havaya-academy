<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="accessibility.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אירועים — הוויה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --white:        #ffffff;
    --off-white:    #faf3e0;
    --lav-pale:     #f4ead9;
    --lav-soft:     #ecdec2;
    --teal-dark:    #015c78;
    --teal-mid:     #0093ab;
    --gold:         #b3854a;
    --glow:         #f6d9a0;
    --text-dark:    #015c78;
    --text-mid:     #6b7d80;
    --text-body:    #3c5058;
    --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
    --ease-ui:     cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{margin:0; padding:0; box-sizing:border-box}
  body{font-family:'Rubik',sans-serif; background:var(--off-white); color:var(--text-dark); direction:rtl}
  img{display:block; max-width:100%}
  a{color:inherit}
  .fade-up{opacity:0; transform:translateY(18px); transition:opacity .6s var(--ease-out), transform .6s var(--ease-out)}
  .fade-up.visible{opacity:1; transform:translateY(0)}
  .container{max-width:900px; margin:0 auto; padding:0 24px}
  section{padding:60px 20px}

  header{background:linear-gradient(90deg, #f2e6c9 0%, #8fb5c4 14%, #3d7d92 32%, #015c78 52%, #2a7288 68%, #a8cdd8 86%, #f2e6c9 100%); border-bottom:1px solid rgba(0,0,0,0.08); position:sticky; top:0; z-index:50}
  .header-inner{max-width:1180px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff}
  .brand img{height:64px; width:auto}
  nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  nav a{position:relative; color:rgba(255,255,255,0.82); text-decoration:none; font-size:0.9rem; font-weight:600; padding:8px 14px; border-radius:10px; transition:color 200ms ease}
  nav a:hover, nav a:focus-visible, nav a.active{color:#fff}
  nav a:hover, nav a:focus-visible{animation:tab-pop 4.5s ease-in-out infinite}
  nav a.active::after{content:''; position:absolute; right:14px; left:14px; bottom:2px; height:3px; border-radius:3px; background:var(--glow)}
  @keyframes tab-pop{
    0%,100%{ transform:scale(1); background:rgba(246,217,160,0); box-shadow:0 0 0 rgba(246,217,160,0); }
    50%{ transform:scale(1.18); background:rgba(246,217,160,0.18); box-shadow:0 0 22px rgba(246,217,160,0.55); }
  }
  .header-cta{background:var(--glow); color:var(--teal-dark); padding:9px 20px; border-radius:24px; font-size:0.85rem; font-weight:700; text-decoration:none; white-space:nowrap}
  .nav-toggle{display:none; flex-direction:column; gap:5px; background:none; border:0; padding:8px; cursor:pointer}
  .nav-toggle span{width:24px; height:2px; background:#fff; border-radius:2px}
  .nav-dropdown{position:relative; display:flex; align-items:center}
  .nav-dropdown-row{display:flex; align-items:center; gap:2px}
  .nav-dropdown-toggle{background:none; border:0; color:rgba(255,255,255,0.7); cursor:pointer; padding:6px; font-size:0.65rem; line-height:1; transition:transform 200ms ease}
  .nav-dropdown-toggle:hover{color:#fff}
  .nav-dropdown.open .nav-dropdown-toggle{transform:rotate(180deg)}
  .nav-dropdown-panel{position:absolute; top:100%; right:0; min-width:230px; max-height:0; overflow:hidden; opacity:0; background:#fff; border-radius:14px; box-shadow:0 16px 40px rgba(0,0,0,0.18); margin-top:10px; z-index:60; transition:max-height 250ms ease, opacity 200ms ease}
  .nav-dropdown.open .nav-dropdown-panel{max-height:600px; opacity:1; padding:8px}
  .nav-dropdown-panel a{display:block; padding:9px 14px; border-radius:10px; color:var(--teal-dark); font-size:0.84rem; font-weight:600; text-decoration:none}
  .nav-dropdown-panel a:hover, .nav-dropdown-panel a:focus-visible{background:var(--lav-pale); color:var(--teal-dark)}
  @media(hover:hover){
    .nav-dropdown:hover .nav-dropdown-panel{max-height:600px; opacity:1; padding:8px}
  }
  @media(max-width:900px){
    nav{display:none; position:absolute; top:100%; right:0; left:0; background:var(--teal-dark); flex-direction:column; align-items:stretch; gap:0; padding:8px 16px 16px; box-shadow:0 12px 24px rgba(0,0,0,0.15)}
    nav.open{display:flex}
    nav a{padding:12px 14px}
    .nav-toggle{display:flex}
    .nav-toggle{order:1}
    .brand{order:2}
    .header-cta{order:3}
    .nav-dropdown{width:100%; flex-direction:column; align-items:stretch}
    .nav-dropdown-row{width:100%; justify-content:space-between; padding-left:6px}
    .nav-dropdown-panel{position:static; box-shadow:none; margin-top:0; border-radius:0; background:transparent; padding:0}
    .nav-dropdown.open .nav-dropdown-panel{padding:4px 0 8px}
    .nav-dropdown-panel a{color:rgba(255,255,255,0.82); padding:10px 28px}
    .nav-dropdown-panel a:hover{background:rgba(255,255,255,0.08); color:#fff}
  }
  @media(max-width:420px){
    .header-cta{padding:8px 14px; font-size:0.78rem}
    .brand img{height:52px}
  }

  .page-hero{background:var(--lav-pale); text-align:center; padding:56px 20px 44px}
  .page-tag{font-size:0.78rem; font-weight:700; letter-spacing:2.5px; color:var(--teal-mid); text-transform:uppercase; margin-bottom:12px}
  .page-title{font-size:clamp(1.6rem,4vw,2.4rem); font-weight:800; color:var(--teal-dark); margin-bottom:14px}
  .page-sub{font-size:0.98rem; color:var(--text-mid); max-width:560px; margin:0 auto}

  /* ── Calendar ── */
  .cal-wrap{max-width:640px; margin:0 auto; background:var(--white); border-radius:24px; padding:28px 26px; box-shadow:0 16px 44px rgba(1,92,120,0.1); border:1px solid rgba(1,108,145,0.08)}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px}
  .cal-nav-btn{width:38px; height:38px; border-radius:50%; border:1.5px solid rgba(1,108,145,0.18); background:var(--off-white); color:var(--teal-dark); font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 150ms ease, transform 150ms ease}
  .cal-nav-btn:hover{background:var(--lav-pale); transform:scale(1.06)}
  .cal-month-title{font-size:1.2rem; font-weight:800; color:var(--teal-dark)}
  .cal-weekdays, .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .cal-weekdays{margin-bottom:8px}
  .cal-weekday{text-align:center; font-size:0.76rem; font-weight:700; color:var(--text-mid); padding:4px 0}
  .cal-day{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; font-size:0.9rem; font-weight:600; color:var(--text-body); position:relative; background:var(--off-white)}
  .cal-day.empty{background:transparent}
  .cal-day.today{box-shadow:inset 0 0 0 2px var(--teal-mid)}
  .cal-day.has-event{background:var(--teal-dark); color:#fff; cursor:pointer; transition:transform 150ms ease, box-shadow 150ms ease}
  .cal-day.has-event:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(1,92,120,0.3)}
  .cal-day .dot{width:5px; height:5px; border-radius:50%; background:var(--glow); margin-top:2px}
  .cal-empty-note{text-align:center; color:var(--text-mid); font-size:0.9rem; margin-top:18px}

  /* ── Event cards ── */
  .events-list{max-width:1400px; margin:0 auto 44px; display:flex; flex-wrap:wrap; justify-content:center; gap:24px}
  .event-card{background:var(--white); border-radius:22px; overflow:hidden; border:1px solid rgba(1,108,145,0.09); box-shadow:0 12px 32px rgba(1,92,120,0.08); display:flex; flex-direction:column; flex:1 1 600px; max-width:680px}
  .event-row{display:flex; flex-wrap:wrap; align-items:stretch}
  .event-date-badge{background:linear-gradient(160deg,var(--teal-dark),var(--teal-mid)); color:#fff; min-width:110px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:2px}
  .event-date-badge .dow{font-size:0.78rem; font-weight:700; opacity:0.85}
  .event-date-badge .dnum{font-size:2.1rem; font-weight:900; line-height:1}
  .event-date-badge .mon{font-size:0.85rem; font-weight:700}
  .event-poster-inline{flex-shrink:0; height:560px; aspect-ratio:2/3; background:var(--lav-pale); overflow:hidden}
  .event-poster-inline img{width:100%; height:100%; object-fit:cover; display:block}
  .event-cta-side{flex:1; min-width:160px; display:flex; align-items:center; justify-content:center; padding:20px}
  @media(max-width:640px){
    .event-row{flex-direction:column}
    .event-poster-inline{width:100%; height:auto; aspect-ratio:2/3}
    .event-cta-side{padding:20px 26px 26px}
  }
  .event-body{flex:1; min-width:240px; padding:22px 26px}
  .event-title{font-size:1.15rem; font-weight:800; color:var(--teal-dark); margin-bottom:6px}
  .event-tagline{font-size:0.85rem; color:var(--gold); font-weight:700; margin-bottom:14px}
  .event-meta{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px}
  .event-meta-item{display:flex; align-items:center; gap:6px; font-size:0.86rem; color:var(--text-mid)}
  .event-meta-item svg{width:15px; height:15px; flex-shrink:0; fill:var(--teal-mid)}
  .event-desc{font-size:0.95rem; line-height:1.8; color:var(--text-body); margin-bottom:14px}
  .event-speakers{display:flex; flex-wrap:wrap; gap:8px}
  .event-speaker-tag{font-size:0.78rem; padding:5px 12px; border-radius:14px; background:var(--lav-pale); color:var(--teal-dark); font-weight:600}
  .event-speaker-tag.irit{background:var(--glow); color:var(--teal-dark); font-weight:800}
  .event-features{list-style:none; display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
  .event-features li{font-size:0.9rem; color:var(--text-body); padding-right:18px; position:relative; line-height:1.6}
  .event-features li::before{content:'•'; color:var(--gold); position:absolute; right:0}
  .event-promo{display:inline-block; font-size:0.82rem; font-weight:700; color:var(--teal-dark); background:var(--glow); padding:6px 14px; border-radius:14px; margin-bottom:14px}
  .event-price{display:flex; align-items:baseline; gap:10px; margin-bottom:14px}
  .event-price .orig{font-size:0.9rem; color:var(--text-mid); text-decoration:line-through}
  .event-price .now{font-size:1.3rem; font-weight:800; color:var(--teal-dark)}
  .event-cta{display:inline-block; background:var(--teal-dark); color:#fff; padding:11px 26px; border-radius:24px; font-size:0.88rem; font-weight:700; text-decoration:none}
  .event-cta:hover{background:var(--teal-mid)}

  footer{background:var(--off-white); border-top:1px solid rgba(1,108,145,0.1); padding:34px 20px; text-align:center; color:var(--text-mid); font-size:0.85rem}
  footer a{text-decoration:none; color:var(--text-mid); margin:0 8px}
  footer a:hover{color:var(--teal-dark)}
  .footer-social{display:flex; justify-content:center; gap:16px; margin-top:14px}
  .footer-social a{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; background:var(--lav-pale); transition:background 180ms ease, transform 180ms ease}
  .footer-social a:hover{background:var(--gold); transform:translateY(-2px)}
  .footer-social svg{width:18px; height:18px; display:block}
</style>
</head>

<script>
'use strict';

/* כל אירוע: date בפורמט YYYY-MM-DD (תאריך אמיתי), שאר השדות תיאוריים.
   speakers אופציונלי - למקרה של אירוע עם כמה מרצות, irit:true מסמן את אירית ברשימה. */
const EVENTS = [
  {
    date: '2026-08-07',
    poster: 'event_speedtalk6.jpg',
    title: 'SPEED TALK #6',
    tagline: 'כיבוד, מינגלינג וחברים',
    time: '12:00 התכנסות · 12:30 תחילת ההרצאות',
    location: 'מלון מנדרין, חוף הצוק, הרצליה',
    description: 'ערב "נשים חרוצות השראה" — 8 מרצות, 8 הרצאות וסיפורי השראה, 10 דקות כל אחת. אירית רולניק תרצה בנושא "ריפוי פחד השורשי". מפיקה ומנחה: שרון גוטליב — מרצה, מנחה ואשת תקשורת המלווה מרצות להגשמה.',
    speakers: [
      { name: 'חן בן דוד', topic: 'הקול בראש' },
      { name: 'רחלי בוחבוט', topic: 'מכאב לשליחות' },
      { name: 'לילך ברנס', topic: 'המסע שלי עם ג׳ני' },
      { name: 'מאיה טהר עדן', topic: 'ים של כלים' },
      { name: 'אירית רולניק', topic: 'ריפוי פחד השורשי', irit: true },
      { name: 'ויקי אלישע', topic: 'לרקוד עם הדי-ג׳יי שבמוח' },
      { name: 'אילנה קאיקוב', topic: 'סיפורים מהקליניקה' },
      { name: 'יפה ביטון', topic: 'החותמת' },
    ],
    link: { url: 'https://pay.grow.link/Njg0MDM~5ffc7829bd68b57b167efcd98b68c485-MzcxMjcwOA', label: 'רכישת כרטיס ←' },
  },
  {
    date: '2026-08-18',
    poster: 'event_michael_course.jpg',
    title: 'פתיחת קורס: תיקשור קו אמצע עם המלאך מיכאל',
    tagline: 'ללמוד להתחבר · לקבל מסרים · לגעת באור',
    location: 'זום או כפר סבא',
    description: 'קורס חדש נפתח — ליווי בתהליך התחברות לנשמה ולאור האלוהי, קבלת מסרים בבהירות ובדיוק, וכלים מעשיים ליישום בחיי היומיום.',
    features: [
      'חיבור לנשמה ולאור האלוהי',
      'קבלת מסרים בבהירות ובדיוק',
      'כלים מעשיים לחיים מלאי משמעות',
      'ליווי אישי בסביבה תומכת',
    ],
    promo: 'הנחה משמעותית: נרשמים ומצרפים בת משפחה — ללא תשלום!',
    price: { orig: '4,800 ₪', now: '3,600 ₪' },
    link: { url: 'course-michael-landing.html', label: 'לפרטים מלאים ולהרשמה ←' },
  },
];

const HE_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_DOW = ['א','ב','ג','ד','ה','ו','ש'];

let calYear, calMonth; // calMonth is 0-11

function eventsInMonth(year, month) {
  return EVENTS.filter(e => {
    const d = new Date(e.date + 'T00:00:00');
    return d.getFullYear() === year && d.getMonth() === month;
  }).sort((a, b) => a.date.localeCompare(b.date));
}

function renderCalendar() {
  document.getElementById('calMonthTitle').textContent = `${HE_MONTHS[calMonth]} ${calYear}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const monthEvents = eventsInMonth(calYear, calMonth);
  const eventDays = new Set(monthEvents.map(e => new Date(e.date + 'T00:00:00').getDate()));

  const today = new Date();
  const isCurrentMonth = today.getFullYear() === calYear && today.getMonth() === calMonth;

  for (let i = 0; i < firstDow; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if (isCurrentMonth && day === today.getDate()) cell.classList.add('today');
    if (eventDays.has(day)) {
      cell.classList.add('has-event');
      cell.innerHTML = `${day}<span class="dot"></span>`;
      cell.addEventListener('click', () => {
        const card = document.getElementById('event-' + calYear + '-' + calMonth + '-' + day);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    } else {
      cell.textContent = String(day);
    }
    grid.appendChild(cell);
  }

  document.getElementById('calEmptyNote').style.display = monthEvents.length ? 'none' : 'block';
  renderEventsList(monthEvents);
}

function renderEventsList(monthEvents) {
  const list = document.getElementById('eventsList');
  list.innerHTML = '';
  monthEvents.forEach(ev => {
    const d = new Date(ev.date + 'T00:00:00');
    const card = document.createElement('div');
    card.className = 'event-card fade-up visible';
    card.id = 'event-' + d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();

    const speakersHtml = (ev.speakers || []).map(s =>
      `<span class="event-speaker-tag${s.irit ? ' irit' : ''}">${s.name}${s.topic ? ' — ' + s.topic : ''}</span>`
    ).join('');

    const metaHtml = [
      ev.time ? `<span class="event-meta-item"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.59 4.24 4.24-1.41 1.41L11 13.41V6h2v6.59z"/></svg>${ev.time}</span>` : '',
      ev.location ? `<span class="event-meta-item"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>${ev.location}</span>` : '',
    ].join('');

    const featuresHtml = ev.features ? `<ul class="event-features">${ev.features.map(f => `<li>${f}</li>`).join('')}</ul>` : '';
    const promoHtml = ev.promo ? `<div class="event-promo">${ev.promo}</div>` : '';
    const priceHtml = ev.price ? `<div class="event-price">${ev.price.orig ? `<span class="orig">${ev.price.orig}</span>` : ''}<span class="now">${ev.price.now}</span></div>` : '';
    const linkHtml = ev.link ? `<a class="event-cta" href="${ev.link.url}" target="_blank" rel="noopener">${ev.link.label}</a>` : '';

    const dateBadgeHtml = `
      <div class="event-date-badge">
        <div class="dow">יום ${HE_DOW[d.getDay()]}</div>
        <div class="dnum">${d.getDate()}</div>
        <div class="mon">${HE_MONTHS[d.getMonth()]}</div>
      </div>`;

    // כשיש פוסטר מעוצב - הוא מחליף לגמרי את המלל (רק תאריך + פוסטר + כפתור).
    // בלי פוסטר (ברירת מחדל לאירועים עתידיים) - נשאר התיאור המלא בטקסט.
    const rowContentHtml = ev.poster
      ? `<div class="event-poster-inline"><img src="${ev.poster}" alt="${ev.title}" loading="lazy"></div>`
      : `<div class="event-body">
          <div class="event-title">${ev.title}</div>
          ${ev.tagline ? `<div class="event-tagline">${ev.tagline}</div>` : ''}
          ${metaHtml ? `<div class="event-meta">${metaHtml}</div>` : ''}
          <p class="event-desc">${ev.description}</p>
          ${featuresHtml}
          ${promoHtml}
          ${priceHtml}
          ${speakersHtml ? `<div class="event-speakers">${speakersHtml}</div>` : ''}
          ${linkHtml}
        </div>`;

    card.innerHTML = `
      <div class="event-row">
        ${dateBadgeHtml}
        ${rowContentHtml}
        ${ev.poster && linkHtml ? `<div class="event-cta-side">${linkHtml}</div>` : ''}
      </div>`;
    list.appendChild(card);
  });
}

document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

(function init() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
})();

const navToggle = document.getElementById('navToggle');
const mainNav = document.getElementById('mainNav');
navToggle.addEventListener('click', () => {
  const isOpen = mainNav.classList.toggle('open');
  navToggle.setAttribute('aria-expanded', String(isOpen));
});
mainNav.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mainNav.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
    document.querySelectorAll('.nav-dropdown.open').forEach(dd => dd.classList.remove('open'));
  });
});

document.querySelectorAll('.nav-dropdown-toggle').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const dropdown = btn.closest('.nav-dropdown');
    const isOpen = dropdown.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(isOpen));
  });
});
document.addEventListener('click', (e) => {
  document.querySelectorAll('.nav-dropdown.open').forEach(dd => {
    if (!dd.contains(e.target)) {
      dd.classList.remove('open');
      dd.querySelector('.nav-dropdown-toggle').setAttribute('aria-expanded', 'false');
    }
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.nav-dropdown.open').forEach(dd => {
      dd.classList.remove('open');
      dd.querySelector('.nav-dropdown-toggle').setAttribute('aria-expanded', 'false');
    });
  }
});

const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
</script>
